[include]
files = [ 
    "keybinds.toml",
    "outputs.toml"
]

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "wayland"
QT_QPA_PLATFORMTHEME = "qt6ct"

##############################
#     General Settings       #
##############################

[general]
autostart = ["noctalia"]
mod_key = "Alt"
xwayland = true
show_cheatsheet = false

[hot_corners.top_left]
enabled = true
delay_ms = 250
action = "overview-open"

##############################
#  Appearance and Layout     #
##############################

[layout]
# mode = "dwindle"
mode = "scrolling"
client_maximize = "edges"

[appearance.title_bar]
mode = "on"
button_background = true
button_glyph = "hover"

[colors.title_bar]
background = "#292933FF"
background_unfocused = "#1A1A1FFF"
text = "#E8E8EAFF"
text_unfocused = "#8A8A92FF"
close = "#FF6B6BFF"
close_glyph = "#FFFFFF"
close_glyph_hover = "#141419FF"
maximize = "#7AA3FFFF"
maximize_glyph = "#FFFFFF"
maximize_glyph_hover = "#141419FF"
minimize = "#FFD166FF"
minimize_glyph = "#FFFFFF"
minimize_glyph_hover = "#141419FF"

[animation]
enabled = true



##############################
#            Input           #
##############################

[input.cursor]
theme = "Adwaita"
size = 24
follows_focus = false
hide_when_typing = false

[input.keyboard]
layout = "us"
repeat_rate = 50
repeat_delay = 250
numlock_toggle = true

[input.touchpad]
natural_scroll = true
tap = true
accel_profile = "custom 0.2144477506 0.000 0.307 0.615 1.077 1.539 2.002 2.505 3.208 3.910 4.613 5.315 6.018 6.720 7.423 8.125 8.828 9.530 10.233 10.935 12.387"
click_method = "clickfinger"

[input.mouse] 
accel_profile = "custom 0.2144477506 0.000 0.307 0.615 1.077 1.539 2.002 2.505 3.208 3.910 4.613 5.315 6.018 6.720 7.423 8.125 8.828 9.530 10.233 10.935 12.387"

[input.focus]
follows_mouse = "off"



##############################
#       Windows Rules        #
##############################


[[window_rule]]
match.app_id = "(steam)|(.*PrismLauncher)"
default_workspace = 1
default_focused = false

[[window_rule]]
match.app_id = "discord"
default_workspace = 1
default_focused = false

[[window_rule]]
match.content_type = "game"
default_focused = false
default_workspace = 2
default_fullscreen = true
hdr = "fullscreen"
vrr = "always"

[[window_rule]]
match.app_id = "^steam_app_[0-9]*$"
default_focused = false 
default_workspace = 2
default_fullscreen = true
hdr = "fullscreen"
vrr = "always"

[[window_rule]]
match.app_id = ".*luciole"
default_floating = true
default_focused = false 
default_floating_size = { width = 0.5, height = 0.6 }

[[window_rule]]
match.app_id = "dev.noctalia.UmbrielSharePicker"
default_floating = true
default_floating_size = { width = 0.5, height = 0.6}

[[window_rule]]
match.app_id = "(qalculate.*)"
default_floating = true
default_floating_size = { width = 0.5, height = 0.6}
